<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Workbooks recorder</title>
<meta name="dw-recorder-version" content="2026-11-17.2800">
<!--
  DESIGN WORKBOOKS RECORDER
  Google's Apps Script page is not allowed to use the microphone or record the screen, so the app opens this
  page in its own tab. It records the screen, the camera or the voice, lets the student watch or listen back,
  and hands the recording straight back to the app tab that opened it (window.opener.postMessage). Nothing is
  uploaded or stored here: uploads still go through the app. If the hand-back is not possible, "Save the file"
  downloads it, and the student uploads it in the app.
  Address parameters (set by the app): mode=screen|camera|voice, max=seconds, id=request id, o=the app's origin,
  mic=1|0, label=what it is for, lang=transcript language (voice).
-->
<style>
:root{--ink:#15212B;--muted:#56656F;--line:#D5DDE3;--sheet:#fff;--bg:#EEF2F5;--accent:#2459A8;--ok:#23744F;--bad:#AE2537;--mark:#C77700}
*{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:0 0 4px} .meta{color:var(--muted);font-size:14px} .card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:9px;padding:9px 16px;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}.sw span{color:var(--muted);font-size:14px}.sw a{padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--sheet)}.sw a[aria-current=true]{background:var(--ink);color:var(--sheet);border-color:var(--ink);font-weight:600}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 10px}.pick div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;background:var(--sheet)}.pick span{font-size:13px;color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.rec{background:var(--bad);border-color:var(--bad);color:#fff} .btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px} label.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px} .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.big{font-size:30px;font-variant-numeric:tabular-nums;font-weight:650} .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:8px;animation:bl 1s infinite} @keyframes bl{50%{opacity:.3}}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px} .bar i{display:block;height:100%;background:var(--accent);width:0}
video,audio{width:100%;margin-top:10px;border-radius:10px;background:#000} audio{background:none}
.msg{padding:10px 12px;border-radius:9px;margin-top:12px} .msg.ok{background:#DEF1E7;color:var(--ok)} .msg.bad{background:#FBE3E6;color:var(--bad)} .msg.warn{background:#FBEAD0;color:#7A4B00}
.cd{position:fixed;inset:0;display:grid;place-items:center;background:rgba(21,33,43,.55);color:#fff;font-size:96px;font-weight:700;z-index:9}
.tr{background:#F6F9FB;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:2.5em;margin-top:10px;font-size:15px}
textarea{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="h">Recorder</h1>
  <p class="meta" id="for"></p>
  <div id="app" class="card" aria-live="polite"></div>
  <p class="meta" style="margin-top:14px">Nothing is saved on this page: the recording goes straight back to your workbook, or to your computer if you press Save the file. <a href="check.html" target="_blank" rel="noopener">Check this device</a></p>
  <p class="meta" id="recver" style="margin-top:10px;font-size:12px">Recorder version 2026-11-17.2800</p>
</main>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const MODE=['screen','camera','voice','voiceover'].includes(Q.get('mode'))?Q.get('mode'):'voice';
const MAX=Math.max(10,Math.min(3600,+Q.get('max')||180));
const ID=String(Q.get('id')||'').slice(0,40);
const APP=String(Q.get('o')||'');
const LABEL=String(Q.get('label')||'').slice(0,200);
const LANG=String(Q.get('lang')||'').slice(0,12);
// the app runs on Google's *.googleusercontent.com pages (localhost only for testing)
const APP_OK=/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(APP)||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(APP);
const CAN_SEND=!!(window.opener&&ID&&APP_OK);
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const NAMES={screen:'Record your screen',camera:'Record with your camera',voice:'Record your voice',voiceover:'Add a voice-over to your video'};
$('#h').textContent=NAMES[MODE]; document.title=NAMES[MODE]+' · Design Workbooks';
$('#for').textContent=(LABEL?'For: '+LABEL+'. ':'')+'Up to '+fmt(MAX)+'; it stops by itself.';
const app=$('#app'), show=h=>{ app.innerHTML=h; const b=app.querySelector('.btn.primary,.btn.rec'); if(b) b.focus(); };
let S=null;   // { streams:[], mr, chunks, t0, paused, pauseAt, timer, ctx, blob, secs, type, tr }

function stopStreams(){ if(!S) return; if(S.mctx&&S.mctx.state!=='closed') try{ S.mctx.close().catch(()=>{}); }catch(e){} S.mctx=null; (S.streams||[]).forEach(st=>st&&st.getTracks().forEach(t=>t.stop())); if(S.ctx&&S.ctx.state!=='closed') try{ S.ctx.close().catch(()=>{}); }catch(e){} if(S.meterRaf) cancelAnimationFrame(S.meterRaf); if(S.rec) try{ S.rec.stop(); }catch(e){} }
function pickType(video){ const list=video?['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']:['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'];
  return list.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } })||''; }
function meter(stream){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(), an=ctx.createAnalyser(); an.fftSize=512; ctx.createMediaStreamSource(stream).connect(an); const d=new Uint8Array(an.fftSize);
  const tick=()=>{ an.getByteTimeDomainData(d); let m=0; for(const v of d) m=Math.max(m,Math.abs(v-128)); const el=$('#lvl'); if(el) el.style.width=Math.min(100,m/1.1)+'%'; S.meterRaf=requestAnimationFrame(tick); }; tick(); return ctx; }catch(e){ return null; } }

/* 1. Start screen: microphone choice (with level), then Start */
function start(){ if(MODE==='voiceover'){ voPrepare(); return; }
  stopStreams(); S={streams:[],chunks:[]};
  const needMicChoice=MODE!=='voice';
  const sw=MODE!=='voice'&&Q.get('mode')&&Q.get('sw')!=='0'?(()=>{ const u=m=>{ const q=new URLSearchParams(location.search); q.set('mode',m); return '?'+q.toString(); };
    return `<div class="sw" role="group" aria-label="What to record"><span>Record:</span><a href="${u('camera')}" aria-current="${MODE==='camera'}">📷 My camera</a><a href="${u('screen')}" aria-current="${MODE==='screen'}">🖥 My screen</a></div>`; })():'';
  show(`${sw}${MODE==='screen'?`<p><b>Step 1.</b> Press <b>Choose what to record</b> below.</p>
    <p><b>Step 2.</b> Your browser opens a box asking what to share. Pick one:</p>
    <div class="pick"><div><b>🖥 Entire screen</b><span>everything you see</span></div><div><b>🪟 Window</b><span>one app window</span></div><div><b>🗂 Chrome tab</b><span>one tab, e.g. your workbook (tick “Share tab audio” for its sound)</span></div></div>
    <p><b>Step 3.</b> Press <b>Share</b>. Recording starts after a 3-second countdown.</p>
    <p class="meta">To stop, come back to this tab and press Stop, or press the browser’s “Stop sharing” bar. On a Mac, the first time, you may need to allow screen recording for your browser in System Settings › Privacy &amp; Security › Screen Recording.</p>`:`<p><b>${MODE==='camera'?'Your camera and microphone will be used.':'Your microphone will be used.'}</b></p>`}
    ${needMicChoice?`<label class="chk"><input type="checkbox" id="mic" ${Q.get('mic')==='0'?'':'checked'}> Use my microphone</label>`:''}
    <div id="micbox"><p class="meta" style="margin-top:10px">Microphone level (speak to test):</p><div class="meter"><i id="lvl"></i></div><p class="meta" id="micmsg"></p></div>
    ${MODE==='camera'?'<video id="pv" autoplay muted playsinline></video>':''}
    <div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn rec" id="go">${MODE==='screen'?'Choose what to record…':'Start recording'}</button></div>`);
  $('#cancel').onclick=cancel;
  const mic=$('#mic'); if(mic) mic.onchange=prepare;
  $('#go').onclick=begin;
  prepare(); }
async function prepare(){ // camera / microphone preview before recording (the browser asks the first time)
  stopStreams(); S={streams:[],chunks:[]};
  const wantMic=MODE==='voice'||($('#mic')&&$('#mic').checked);
  $('#micbox').hidden=!wantMic;
  try{
    if(MODE==='camera'){ const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:wantMic}); S.cam=st; S.streams.push(st); const pv=$('#pv'); if(pv) pv.srcObject=st; if(wantMic) S.ctx=meter(st); }
    else if(wantMic){ const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); S.mic=st; S.streams.push(st); S.ctx=meter(st); }
    const m=$('#micmsg'); if(m) m.textContent='';
  }catch(e){ const m=$('#micmsg');
    const why=e&&e.name==='NotAllowedError'?'was not allowed. Click the camera or microphone icon in the address bar to allow it, then press Start again.':e&&e.name==='NotFoundError'?'was not found on this device.':'could not be used ('+(e&&e.message||e)+').';
    if(MODE==='screen'){ if(m) m.textContent='The microphone '+why+' You can still record without your voice.'; }
    else show(`<div class="msg bad">The ${MODE==='camera'?'camera':'microphone'} ${esc(why)}</div><div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="again">Try again</button></div>`), $('#cancel').onclick=cancel, $('#again').onclick=start; }
}
async function countdown(){ const c=document.createElement('div'); c.className='cd'; document.body.appendChild(c); for(const n of [3,2,1]){ c.textContent=n; await new Promise(z=>setTimeout(z,800)); } c.remove(); }

/* 2. Recording */
async function begin(){
  const wantMic=MODE==='voice'||($('#mic')&&$('#mic').checked);
  let tracks=[], video=MODE!=='voice';
  try{
    if(MODE==='screen'){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia) throw Object.assign(new Error('This browser cannot record the screen. Use Chrome or Edge on a laptop or Chromebook.'),{name:'NoScreen'});
      const disp=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always',frameRate:{ideal:24,max:30},width:{max:1920},height:{max:1080}},audio:true,selfBrowserSurface:'exclude',surfaceSwitching:'include'});
      S.disp=disp; S.streams.push(disp);
      disp.getVideoTracks()[0].addEventListener('ended',()=>{ if(S&&S.mr&&S.mr.state!=='inactive') S.mr.stop(); });
      const auds=[...disp.getAudioTracks(),...(wantMic&&S.mic?S.mic.getAudioTracks():[])];
      tracks=[...disp.getVideoTracks()];
      if(auds.length>1){ const ctx=new AudioContext(), dst=ctx.createMediaStreamDestination(); [new MediaStream(disp.getAudioTracks()),S.mic].forEach(st=>{ if(st&&st.getAudioTracks().length) ctx.createMediaStreamSource(st).connect(dst); }); S.mix=ctx; tracks=tracks.concat(dst.stream.getAudioTracks()); }
      else tracks=tracks.concat(auds);
      await countdown();
    } else if(MODE==='camera'){ if(!S.cam) await prepare(); if(!S.cam) return; tracks=S.cam.getTracks(); }
    else { if(!S.mic) await prepare(); if(!S.mic) return; tracks=S.mic.getAudioTracks(); }
  }catch(e){
    if(e&&e.name==='NotAllowedError'&&!/policy/i.test(e.message||'')){ show(`<div class="msg warn">Recording was not started: nothing was chosen to share.</div><div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="again">Try again</button></div>`); }
    else show(`<div class="msg bad">${esc(e&&e.message||'Recording is not possible here.')}</div><p class="meta">On a school Chromebook, screen recording may be switched off by the school. You can also record with the device’s own screen recorder and upload the video in the workbook.</p><div class="acts"><button class="btn" id="cancel">Close</button><button class="btn primary" id="again">Try again</button></div>`);
    $('#cancel').onclick=cancel; $('#again').onclick=start; return; }
  const type=pickType(video);
  let mr; try{ mr=new MediaRecorder(new MediaStream(tracks),type?Object.assign({mimeType:type},video?{videoBitsPerSecond:1800000}:{}):{}); }
  catch(e){ show(`<div class="msg bad">This browser cannot make a recording (${esc(e.message)}).</div><div class="acts"><button class="btn" id="cancel">Close</button></div>`); $('#cancel').onclick=cancel; return; }
  S.mr=mr; S.type=(mr.mimeType||type||(video?'video/webm':'audio/webm')).split(';')[0]; S.paused=0; S.pauseAt=0;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) S.chunks.push(e.data); };
  mr.onstop=finished;
  // live transcript for voice (Chrome / Edge), returned with the recording; the student can correct it in the app
  S.tr=''; if(MODE==='voice'){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ try{ const r=new SR(); r.continuous=true; r.interimResults=true; r.lang=LANG||navigator.language||'en-GB'; let fin='';
    r.onresult=ev=>{ let inter=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin+=t+' '; else inter+=t; } S.tr=fin.trim(); const el=$('#trl'); if(el) el.innerHTML=esc(fin)+(inter?'<span class="meta">'+esc(inter)+'</span>':''); };
    r.onend=()=>{ if(S&&S.mr&&S.mr.state==='recording') try{ r.start(); }catch(e){} }; r.start(); S.rec=r; }catch(e){} } }
  mr.start(1000); S.t0=Date.now();
  show(`<p class="big"><span class="dot" aria-hidden="true"></span><span id="t">0:00</span> <span class="meta">of ${fmt(MAX)}</span></p><div class="bar"><i id="b"></i></div>
    ${MODE==='camera'?'<video id="pv2" autoplay muted playsinline></video>':''}
    ${MODE!=='screen'?'<div class="meter"><i id="lvl"></i></div>':''}
    ${MODE==='voice'?'<div class="tr" id="trl"><span class="meta">The words you say appear here (if this browser can).</span></div>':''}
    <div class="acts"><button class="btn" id="pause">❚❚ Pause</button><button class="btn primary" id="stop">■ Stop</button></div>`);
  if(MODE==='camera'){ const v=$('#pv2'); if(v) v.srcObject=S.cam; }
  $('#stop').onclick=()=>{ if(S.mr.state!=='inactive') S.mr.stop(); };
  $('#pause').onclick=()=>{ if(S.mr.state==='recording'){ S.mr.pause(); S.pauseAt=Date.now(); $('#pause').textContent='▶ Resume'; } else if(S.mr.state==='paused'){ S.paused+=Date.now()-S.pauseAt; S.pauseAt=0; S.mr.resume(); $('#pause').textContent='❚❚ Pause'; } };
  const title=document.title;
  S.timer=setInterval(()=>{ const s=((S.pauseAt||Date.now())-S.t0-S.paused)/1000; const t=$('#t'), b=$('#b'); if(t) t.textContent=fmt(s); if(b) b.style.width=Math.min(100,100*s/MAX)+'%'; document.title='⏺ '+fmt(s)+' · '+title;
    if(s>=MAX&&S.mr.state==='recording'){ S.mr.stop(); } },250);
}

/* 3. Watch or listen back, then hand it back */
function finished(){
  clearInterval(S.timer); document.title=NAMES[MODE]+' · Design Workbooks';
  S.secs=S.fixedSecs||Math.round(((S.pauseAt||Date.now())-S.t0-S.paused)/1000); stopStreams();
  S.blob=new Blob(S.chunks,{type:S.type});
  if(!S.blob.size){ show(`<div class="msg bad">Nothing was recorded.</div><div class="acts"><button class="btn" id="cancel">Close</button><button class="btn primary" id="again">Record again</button></div>`); $('#cancel').onclick=cancel; $('#again').onclick=start; return; }
  const url=URL.createObjectURL(S.blob);
  show(`<p><b>${MODE==='voice'?'Listen back':'Watch it back'}</b> <span class="meta">${fmt(S.secs)}</span></p>
    ${MODE==='voice'?`<audio controls src="${url}"></audio>`:`<video controls playsinline src="${url}"></video>`}
    ${MODE==='voice'?`<p class="meta" style="margin-top:10px">What you said (correct it if you like):</p><textarea id="tre" rows="3">${esc(S.tr)}</textarea>`:''}
    ${CAN_SEND?'':'<div class="msg warn">This recorder was not opened from your workbook, so press Save the file and upload it in the workbook.</div>'}
    <div class="acts"><button class="btn" id="again">Record again</button><button class="btn" id="save">Save the file</button>${CAN_SEND?'<button class="btn primary" id="use">Use this recording</button>':''}<button class="btn" id="cancel">Cancel</button></div><div id="sendmsg"></div>`);
  $('#again').onclick=start; $('#cancel').onclick=cancel; $('#save').onclick=save;
  const u=$('#use'); if(u) u.onclick=send; }
/* 4. Voice-over: the student's video plays and their voice is recorded over it (picture recorded again as it plays) */
let VO={src:null,url:''};
function voInit(){ if(CAN_SEND){ show('<p>Loading your video…</p>'); try{ window.opener.postMessage({type:'dw-vo-ready',v:'2026-11-17.2800',id:ID},APP); }catch(e){} setTimeout(()=>{ if(!VO.src) voPick('Your video did not arrive from the workbook. You can choose the video file instead.'); },20000); } else voPick(''); }
window.addEventListener('message',e=>{ const d=e.data; if(!d||d.type!=='dw-vo-src'||d.id!==ID||e.origin!==APP||!(d.blob instanceof Blob)) return; if(VO.src) return; VO.src=d.blob; voPrepare(); });
function voPick(msg){ show(`${msg?'<div class="msg warn">'+esc(msg)+'</div>':''}<p><b>Choose a video to talk over.</b></p><input type="file" id="vof" accept="video/*"><div class="acts"><button class="btn" id="cancel">Cancel</button></div>`); $('#cancel').onclick=cancel; $('#vof').onchange=e=>{ const f=e.target.files[0]; if(f){ VO.src=f; voPrepare(); } }; }
function voPrepare(){ stopStreams(); S={streams:[],chunks:[]}; if(VO.url) URL.revokeObjectURL(VO.url); VO.url=URL.createObjectURL(VO.src);
  show(`<video id="vov" playsinline src="${VO.url}" style="width:100%;max-height:52vh;background:#000;border-radius:8px"></video>
    <div class="vo-bar"><div class="meter"><i id="vop"></i></div><span class="meta" id="vot">0:00</span></div>
    <label class="chk"><input type="checkbox" id="vokeep" checked> Keep the video’s own sound (quieter, under your voice)</label>
    <p class="meta">Press <b>Record voice-over</b>: the video plays and your voice is recorded over it. You can pause, or stop early. Headphones help if you want to hear the video’s sound while you talk.</p>
    <p class="meta">Microphone level (speak to test):</p><div class="meter"><i id="lvl"></i></div>
    <div class="acts" id="voacts"><button class="btn" id="cancel">Cancel</button><button class="btn rec" id="vogo">● Record voice-over</button></div><div id="voch"></div>`);
  $('#cancel').onclick=cancel; $('#vogo').onclick=voRecord; const v=$('#vov'); v.onloadedmetadata=()=>{ $('#vot').textContent='0:00 of '+fmt(v.duration||0); };
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{ S.mic=st; S.streams.push(st); S.mctx=meter(st); }).catch(()=>{}); }
async function voRecord(){ const v=$('#vov'), keep=$('#vokeep').checked;
  try{ if(!S.mic){ S.mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); S.streams.push(S.mic); S.mctx=meter(S.mic); } }
  catch(e){ show(`<div class="msg bad">The microphone ${e&&e.name==='NotAllowedError'?'was not allowed. Allow it in the address bar, then try again.':'could not be used.'}</div><div class="acts"><button class="btn primary" id="again">Try again</button></div>`); $('#again').onclick=voPrepare; return; }
  const ctx=new (window.AudioContext||window.webkitAudioContext)(); S.ctx=ctx; const dest=ctx.createMediaStreamDestination();
  const mg=ctx.createGain(); ctx.createMediaStreamSource(S.mic).connect(mg); mg.connect(dest); S.mg=mg;
  try{ const vs=ctx.createMediaElementSource(v), vg=ctx.createGain(), hear=ctx.createGain(); vg.gain.value=keep?0.35:0; hear.gain.value=keep?0.6:0; vs.connect(vg); vg.connect(dest); vs.connect(hear); hear.connect(ctx.destination); }catch(e){}
  let vt=null; try{ const cs=v.captureStream?v.captureStream():v.mozCaptureStream?v.mozCaptureStream():null; vt=cs&&cs.getVideoTracks()[0]; }catch(e){}
  if(!vt){ const c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720; const g=c.getContext('2d'); const draw=()=>{ if(!S||S.done) return; try{ g.drawImage(v,0,0,c.width,c.height); }catch(e){} S.raf=requestAnimationFrame(draw); }; draw(); const cs=c.captureStream(30); S.streams.push(cs); vt=cs.getVideoTracks()[0]; }
  const out=new MediaStream([vt].concat(dest.stream.getAudioTracks())); const type=pickType(true);
  let mr; try{ mr=new MediaRecorder(out,type?{mimeType:type,videoBitsPerSecond:2500000}:undefined); }catch(e){ mr=new MediaRecorder(out); }
  S.type=mr.mimeType||type||'video/webm'; S.mr=mr; S.chunks=[]; S.t0=Date.now(); S.paused=0;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) S.chunks.push(e.data); };
  mr.onstop=()=>{ S.done=true; S.fixedSecs=Math.max(1,Math.round(S.upTo||v.currentTime||0)); if(S.raf) cancelAnimationFrame(S.raf); clearInterval(S.vtick); finished(); };
  const prog=()=>{ S.upTo=v.currentTime; const d=v.duration||1; $('#vop').style.width=Math.min(100,100*v.currentTime/d)+'%'; $('#vot').textContent=fmt(v.currentTime)+' of '+fmt(d)+(S.rest?' · adding the rest, '+fmt(d-v.currentTime)+' left':''); };
  S.vtick=setInterval(prog,250); v.onended=()=>{ prog(); if(mr.state!=='inactive') mr.stop(); };
  v.currentTime=0; mr.start(1000); try{ await v.play(); }catch(e){}
  voCtl('rec'); }
function voCtl(st){ const a=$('#voacts'), v=$('#vov'), mr=S.mr; $('#voch').innerHTML='';
  if(st==='rec'){ a.innerHTML='<button class="btn" id="vopause">❚❚ Pause</button><button class="btn rec" id="vostop">■ Stop</button>';
    $('#vopause').onclick=()=>{ if(v.paused){ v.play(); if(mr.state==='paused') mr.resume(); $('#vopause').textContent='❚❚ Pause'; } else { v.pause(); if(mr.state==='recording') mr.pause(); $('#vopause').textContent='▶ Carry on'; } };
    $('#vostop').onclick=()=>{ v.pause(); if(mr.state==='recording') mr.pause(); voCtl('stopped'); }; }
  else if(st==='stopped'){ a.innerHTML='';
    $('#voch').innerHTML=`<div class="msg"><b>Stopped at ${fmt(v.currentTime)} of ${fmt(v.duration||0)}.</b> What now?</div><div class="acts" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn primary" id="vo-use">Use what I have</button><button class="btn" id="vo-on">Keep going</button><button class="btn" id="vo-rest">Finish without talking</button></div><p class="meta">Use what I have: the video ends here. Finish without talking: the rest plays through with the video’s own sound (about ${fmt(Math.max(0,(v.duration||0)-v.currentTime))}).</p>`;
    $('#vo-use').onclick=()=>{ S.upTo=v.currentTime; if(mr.state!=='inactive') mr.stop(); };
    $('#vo-on').onclick=()=>{ v.play(); if(mr.state==='paused') mr.resume(); voCtl('rec'); };
    $('#vo-rest').onclick=()=>{ if(S.mg) S.mg.gain.value=0; S.rest=true; v.play(); if(mr.state==='paused') mr.resume(); a.innerHTML='<span class="meta">Adding the rest of the video…</span>'; $('#voch').innerHTML=''; }; } }
function fileName(){ const ext=/mp4/.test(S.type)?(MODE==='voice'?'m4a':'mp4'):/ogg/.test(S.type)?'ogg':'webm'; return (MODE==='screen'?'screen recording':MODE==='camera'?'camera recording':MODE==='voiceover'?'video with voice-over':'voice recording')+' '+new Date().toISOString().slice(0,16).replace('T',' ').replace(':','.')+'.'+ext; }
function save(){ const a=document.createElement('a'); a.href=URL.createObjectURL(S.blob); a.download=fileName(); document.body.appendChild(a); a.click(); a.remove();
  $('#sendmsg').innerHTML='<div class="msg ok">Saved to your computer (Downloads). In your workbook, choose Upload and pick this file.</div>'; }
let ACKED=false;
function send(){
  const tr=$('#tre')?$('#tre').value.trim():S.tr;
  try{ window.opener.postMessage({type:'dw-rec',v:'2026-11-17.2800',id:ID,mode:MODE,blob:S.blob,mime:S.type,secs:S.secs,name:fileName(),tr},APP); }
  catch(e){ $('#sendmsg').innerHTML='<div class="msg bad">It could not be sent to your workbook ('+esc(e.message)+'). Press Save the file, then upload it in the workbook.</div>'; return; }
  $('#use').disabled=true; $('#sendmsg').innerHTML='<div class="msg">Sending to your workbook…</div>';
  setTimeout(()=>{ if(ACKED) return; $('#use').disabled=false; $('#sendmsg').innerHTML='<div class="msg warn">Your workbook did not answer. Is its tab still open? Try again, or press Save the file and upload it in the workbook.</div>'; },5000); }
window.addEventListener('message',e=>{ const d=e.data; if(!d||d.type!=='dw-rec-ok'||d.id!==ID||e.origin!==APP) return; ACKED=true;
  show('<div class="msg ok"><b>Done.</b> The recording is in your workbook. This tab closes by itself; if it does not, close it and go back to your workbook.</div>'); setTimeout(()=>window.close(),900); });
function cancel(){ stopStreams(); clearInterval(S&&S.timer); try{ if(CAN_SEND) window.opener.postMessage({type:'dw-rec-cancel',id:ID},APP); }catch(e){}
  show('<p>Cancelled. You can close this tab.</p>'); setTimeout(()=>window.close(),600); }
window.addEventListener('beforeunload',stopStreams);

if(!navigator.mediaDevices||!window.MediaRecorder){ show('<div class="msg bad">This browser cannot record. Use Chrome, Edge or Safari (up to date).</div>'); return; }
if(MODE==='voiceover'){ $('#for').textContent='Talk over your video. It comes back to your workbook when you press Use this recording.'; voInit(); return; }
if(!Q.get('mode')){   // opened on its own (not from the app): choose what to record, to try it out
  $('#h').textContent='Design Workbooks recorder'; document.title='Recorder · Design Workbooks';
  $('#for').textContent='Opened on its own, so this is a try-out: you can watch or save what you record. In the app, recording opens this page for you.';
  const u=m=>'?mode='+m+'&max='+(m==='voice'?180:120);
  show(`<p><b>What do you want to try?</b></p><div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><a class="btn primary" href="${u('voice')}">🎙 Record my voice</a><a class="btn primary" href="${u('screen')}">🖥 Record my screen</a><a class="btn primary" href="${u('camera')}">📷 Record with my camera</a><a class="btn primary" href="?mode=voiceover">🎙 Add a voice-over to a video</a></div><p class="meta"><a href="check.html">Check what this device can record</a></p>`);
  return; }
start();
})();
</script>
</body>
